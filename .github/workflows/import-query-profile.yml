name: Full import query profile
on:
  workflow_call:
    inputs:
      rows:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      rows:
        description: Synthetic import rows (1000 to 2000000)
        default: '150000'
        required: true
permissions:
  contents: read
jobs:
  import-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NODE_ENV: test
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
      STOCKCHIEF_RUN_LARGE_IMPORT: '1'
      STOCKCHIEF_IMPORT_PROFILE: '1'
      STOCKCHIEF_IMPORT_CERTIFICATION_ROWS: ${{ inputs.rows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PostgreSQL 17
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - name: Import, reconcile and profile synthetic stock
        run: |
          mkdir -p output/import-profile
          set -euo pipefail
          node --max-old-space-size=1024 --test tests/certification/inventory-million-rows.test.js 2>&1 | tee output/import-profile/certification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-query-profile
          path: output/import-profile
