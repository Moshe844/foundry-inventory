name: Extended tests (manual)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Local suite to run without provider credentials
        required: true
        default: postgres
        type: choice
        options:
          - postgres
          - e2e

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  extended:
    name: Manual ${{ inputs.suite }} (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install PostgreSQL 16 binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "STOCKCHIEF_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run complete PostgreSQL suite
        if: inputs.suite == 'postgres'
        run: npm run test:postgres
      - name: Run browser end-to-end suite
        if: inputs.suite == 'e2e'
        run: npm run test:e2e
