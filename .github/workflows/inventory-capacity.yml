        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'agents' }}
        run: node --test --test-concurrency=2 tests/postgres/agent-return-disposition.test.js tests/postgres/agent-return-disposition-boundaries.test.js tests/postgres/agent-return-disposition-ui.test.js tests/postgres/agent-return-disposition-schema.test.js tests/postgres/agent-return-disposition-navigation.test.js tests/postgres/agent-return-disposition-volume.test.js tests/postgres/agent-return-disposition-reporting.test.js
