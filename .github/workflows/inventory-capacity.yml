name: Inventory correctness and capacity
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, codex/staging-codex-pilot]
  workflow_dispatch:
    inputs:
      large_rows:
        description: Rows in the full PostgreSQL import certification (1000–2000000)
        default: '1000000'
        required: true
      profile_only:
        description: Run the full synthetic import with query profiling; normal release checks stay unchanged
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Long certifications preserve evidence for their source revision. Normal
  # PR checks still replace obsolete runs when another commit is pushed.
  group: inventory-capacity-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')) && github.sha || 'latest' }}
  cancel-in-progress: true
jobs:
  inventory:
    if: github.event_name != 'workflow_dispatch' || !inputs.profile_only
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')) && 300 || 45 }}
    env:
      NODE_ENV: test
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PostgreSQL 17
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parser, source identity and provider contracts
        run: |
          mkdir -p output/inventory-ci
          set -euo pipefail
          node --test tests/unit/crash-monitor.test.js tests/unit/mailbox-navigation.test.js tests/unit/totp.test.js tests/unit/invoice-email-attachment.test.js tests/unit/import-analysis-notice.test.js tests/unit/xlsx-integrity-capacity.test.js tests/unit/provider-response-capacity.test.js tests/unit/provider-streaming-discovery.test.js tests/unit/commerce-quantity-events.test.js tests/unit/bigcommerce-adapter.test.js tests/unit/multipart-capacity.test.js tests/unit/multipart-reuse.test.js tests/unit/import-indexed-delimited.test.js tests/unit/import-validation-scratch.test.js tests/unit/import-source-identity.test.js tests/unit/request-read-cache.test.js tests/unit/import-progress.test.js tests/unit/import-execution-identities.test.js tests/unit/integration-store-network.test.js tests/unit/import-delimiter-preamble.test.js tests/unit/accounting-catalog-contract.test.js tests/unit/commercial-production-boundaries.test.js 2>&1 | tee output/inventory-ci/unit.log
      - name: Image columns and reviewed source evidence
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/unit/round16-image-columns.test.js tests/unit/image-table-import.test.js tests/unit/image-import-quality.test.js tests/unit/image-table-rules.test.js tests/unit/image-codecs.test.js tests/postgres/image-import-review.test.js tests/postgres/image-codec-review.test.js tests/unit/pdf-table-import.test.js 2>&1 | tee output/inventory-ci/image-columns.log
      - name: PostgreSQL correctness, limits, durable batches and customer screens
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/round16-mfa.test.js tests/postgres/round16-security-audit.test.js tests/postgres/round16-billing-warning.test.js tests/postgres/round16-order-draft.test.js tests/postgres/round16-supplier-invoice.test.js tests/postgres/round16-invoice-document.test.js tests/postgres/round16-business-workbook.test.js tests/postgres/round16-migration-startup.test.js tests/postgres/operations-ui.test.js tests/postgres/cardknox-gateway.test.js tests/postgres/pricing-promotions.test.js tests/postgres/round16-request-boundaries.test.js tests/postgres/round16-stock-costs.test.js tests/postgres/round16-generic-variants.test.js tests/postgres/round16-variant-batch.test.js tests/postgres/round16-catalog-filters.test.js tests/postgres/round16-variant-import.test.js tests/postgres/provider-catalog-cache.test.js tests/postgres/provider-sync.test.js tests/postgres/connection-synchronization.test.js tests/postgres/commerce-position-sync.test.js tests/postgres/warehouse-pages.test.js tests/postgres/import-many-axes.test.js tests/postgres/import-catalogue-no-stock.test.js tests/postgres/import-details-bulk-catalog.test.js tests/postgres/variant-maintenance.test.js tests/postgres/grouped-inbox.test.js tests/postgres/audit-trail.test.js tests/postgres/outbound-webhooks.test.js tests/postgres/team-approval-authority.test.js tests/postgres/ask-health.test.js tests/postgres/import-mixed-tracking.test.js tests/postgres/developer-account-removal.test.js tests/postgres/business-number-capacity.test.js tests/postgres/warehouse-tracked-capacity.test.js tests/postgres/warehouse-waves-ui.test.js tests/postgres/catalog-page-capacity.test.js tests/postgres/import-preview-revisions.test.js tests/postgres/inventory-capacity.test.js tests/postgres/inventory-erp-correctness.test.js tests/postgres/inventory-engine.test.js tests/postgres/manual-stock-removal.test.js tests/postgres/import-durable-batches.test.js tests/postgres/import-price-batches.test.js tests/postgres/import-durable-retry.test.js tests/postgres/import-execution-pages.test.js tests/postgres/import-extended-scale-holdout.test.js tests/postgres/import-stock-intent.test.js tests/postgres/import-identity-revision.test.js tests/postgres/import-sku-identity.test.js tests/postgres/import-source-upload.test.js tests/postgres/replenishment-global-scope.test.js tests/postgres/replenishment-outcome-correctness.test.js tests/postgres/product-planning-scale.test.js tests/postgres/planning-ui.test.js tests/postgres/public-plan-contract.test.js tests/postgres/public-offer-ui.test.js 2>&1 | tee output/inventory-ci/postgres.log
      - name: ERP cutover and exact quantity regressions
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/unit/exact-quantity.test.js tests/unit/odoo-cutover-reader.test.js tests/unit/commercial-network.test.js tests/unit/postgres-migration-history.test.js tests/unit/persisted-secret-startup.test.js tests/postgres/erp-cutover-contract.test.js tests/postgres/erp-cutover-batches.test.js tests/postgres/erp-cutover-application.test.js tests/postgres/erp-cutover-ui.test.js tests/postgres/odoo-cutover-qualified.test.js tests/postgres/measured-stock.test.js tests/postgres/existing-stock-costs.test.js tests/postgres/transfers-ui.test.js 2>&1 | tee output/inventory-ci/erp-cutover.log
      - name: Complex inventory and source concurrency
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/customer-source-concurrency.test.js tests/postgres/manufacturing-tracking.test.js tests/postgres/manufacturing-stock-safety.test.js tests/postgres/manufacturing-cost-authority.test.js tests/postgres/manufacturing-capacity.test.js tests/postgres/completion-custody-safety.test.js tests/postgres/rental-billing-safety.test.js tests/postgres/reservation-concurrency.test.js tests/postgres/multiwarehouse-allocation.test.js 2>&1 | tee output/inventory-ci/complex-inventory.log
      - name: Historical stock costs and availability protection
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/round16-missing-issue-cost.test.js tests/postgres/round16-stock-overview.test.js tests/postgres/round16-return-availability.test.js tests/postgres/round16-availability-summary.test.js tests/postgres/round16-daily-account-totals.test.js tests/postgres/round16-profit-report-projection.test.js tests/postgres/rental-bookings.test.js tests/postgres/round16-request-read-cost.test.js tests/postgres/round16-versioned-reads.test.js tests/postgres/round16-business-read-capacity.test.js tests/postgres/health-probes.test.js tests/unit/edge-availability.test.js tests/unit/request-rate-limit.test.js tests/unit/status-page-browser.test.js 2>&1 | tee output/inventory-ci/costs-availability.log
      - name: Generic variant grids, list filters and count approvals
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/round16-quantity-grid.test.js tests/postgres/round16-variant-views.test.js tests/postgres/round16-count-reviews.test.js tests/postgres/round16-inline-variant-stock.test.js 2>&1 | tee output/inventory-ci/variant-grids.log
      - name: Kit recipe snapshots and component reservations
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/round16-kit-recipes.test.js tests/postgres/round16-kit-reservations.test.js tests/postgres/round16-kit-cost-batches.test.js tests/postgres/round16-kit-consumption.test.js tests/postgres/round16-kit-order-lifecycle.test.js tests/postgres/round16-kit-reviews.test.js tests/postgres/round16-kit-parcels.test.js tests/postgres/round16-kit-browser.test.js tests/postgres/round16-kit-plan-terms.test.js 2>&1 | tee output/inventory-ci/kits.log
      - name: Variant answers and fresh replenishment
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/round16-ask-variants.test.js tests/postgres/round16-ask-sales-period.test.js tests/postgres/round16-replenishment-freshness.test.js tests/postgres/round16-attention-capacity.test.js tests/postgres/replenishment-outcome-correctness.test.js tests/postgres/replenishment-global-scope.test.js 2>&1 | tee output/inventory-ci/variant-answers-freshness.log
      - name: Variant report totals and visible supplier linking
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/round16-variant-reports.test.js tests/postgres/round16-variant-reordering.test.js 2>&1 | tee output/inventory-ci/variant-reports-reordering.log
      - name: Tracked product pages in the browser
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/tracked-product-pages.test.js tests/postgres/round16-tracked-variant-sales.test.js tests/postgres/round16-batch-expiry-alerts.test.js tests/postgres/round16-business-variant-qualification.test.js 2>&1 | tee output/inventory-ci/tracked-products.log
      - name: Provider automatic import and owner approval
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/provider-review-pages.test.js tests/postgres/provider-automatic-pages.test.js tests/postgres/provider-catalog-import.test.js tests/postgres/catalogue-stock-evidence.test.js tests/postgres/accounting-catalog-import.test.js 2>&1 | tee output/inventory-ci/provider-import.log
      - name: Maintenance fairness and worker isolation
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/maintenance-claims.test.js tests/postgres/maintenance-batches.test.js tests/postgres/maintenance-progress.test.js tests/postgres/worker-lane-isolation.test.js 2>&1 | tee output/inventory-ci/maintenance.log
      - name: Full large-import certification
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')
        timeout-minutes: 240
        env:
          STOCKCHIEF_RUN_LARGE_IMPORT: '1'
          STOCKCHIEF_IMPORT_CERTIFICATION_ROWS: ${{ inputs.large_rows || '1000000' }}
        run: |
          set -euo pipefail
          node --max-old-space-size=1024 --test tests/certification/inventory-million-rows.test.js 2>&1 | tee output/inventory-ci/large-import.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-capacity-results
          path: output/inventory-ci
  import-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_only
    uses: ./.github/workflows/import-query-profile.yml
    with:
      rows: ${{ inputs.large_rows }}
