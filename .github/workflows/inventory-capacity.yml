      - name: Full unit and integration regression audit
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'unit' }}
        run: |
          set -euo pipefail
          # The 117-case actions file creates independent on-disk databases.
          # Keep a bounded file deadline with room for four concurrent files;
          # stock throughput and page latency have separate strict assertions.
          # Let test streams drain naturally: forced exit can drop child verdicts
          # on Linux pipes (nodejs/node#64833), including the summary count.
          node --test --test-concurrency=4 --test-timeout=180000 tests/unit/*.test.js tests/integration/*.test.js 2>&1 | tee output/inventory-ci/full-regressions.log
