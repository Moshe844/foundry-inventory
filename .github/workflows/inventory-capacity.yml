name: Inventory correctness and capacity
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, codex/staging-codex-pilot]
  workflow_dispatch:
    inputs:
      large_rows:
        description: Rows in the full PostgreSQL import certification (1000–2000000)
        default: '1000000'
        required: true
permissions:
  contents: read
concurrency:
  # Long certifications preserve evidence for their source revision. Normal
  # PR checks still replace obsolete runs when another commit is pushed.
  group: inventory-capacity-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')) && github.sha || 'latest' }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')) && 300 || 45 }}
    env:
      NODE_ENV: test
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parser, source identity and provider contracts
        run: |
          mkdir -p output/inventory-ci
          set -euo pipefail
          node --test tests/unit/xlsx-integrity-capacity.test.js tests/unit/provider-response-capacity.test.js tests/unit/provider-streaming-discovery.test.js tests/unit/commerce-quantity-events.test.js tests/unit/bigcommerce-adapter.test.js tests/unit/multipart-capacity.test.js tests/unit/multipart-reuse.test.js tests/unit/import-indexed-delimited.test.js tests/unit/import-validation-scratch.test.js tests/unit/import-source-identity.test.js tests/unit/import-delimiter-preamble.test.js tests/unit/accounting-catalog-contract.test.js tests/unit/commercial-production-boundaries.test.js 2>&1 | tee output/inventory-ci/unit.log
      - name: PostgreSQL correctness, limits, durable batches and customer screens
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/provider-catalog-cache.test.js tests/postgres/provider-sync.test.js tests/postgres/connection-synchronization.test.js tests/postgres/commerce-position-sync.test.js tests/postgres/warehouse-pages.test.js tests/postgres/import-many-axes.test.js tests/postgres/developer-account-removal.test.js tests/postgres/business-number-capacity.test.js tests/postgres/warehouse-tracked-capacity.test.js tests/postgres/warehouse-waves-ui.test.js tests/postgres/catalog-page-capacity.test.js tests/postgres/import-preview-revisions.test.js tests/postgres/inventory-capacity.test.js tests/postgres/inventory-erp-correctness.test.js tests/postgres/inventory-engine.test.js tests/postgres/import-durable-batches.test.js tests/postgres/import-execution-pages.test.js tests/postgres/import-extended-scale-holdout.test.js tests/postgres/import-stock-intent.test.js tests/postgres/import-sku-identity.test.js tests/postgres/import-source-upload.test.js tests/postgres/replenishment-global-scope.test.js tests/postgres/replenishment-outcome-correctness.test.js tests/postgres/product-planning-scale.test.js tests/postgres/planning-ui.test.js tests/postgres/public-plan-contract.test.js tests/postgres/public-offer-ui.test.js 2>&1 | tee output/inventory-ci/postgres.log
      - name: Complex inventory and source concurrency
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/customer-source-concurrency.test.js tests/postgres/manufacturing-tracking.test.js tests/postgres/manufacturing-stock-safety.test.js tests/postgres/manufacturing-cost-authority.test.js tests/postgres/manufacturing-capacity.test.js tests/postgres/completion-custody-safety.test.js tests/postgres/rental-billing-safety.test.js tests/postgres/reservation-concurrency.test.js 2>&1 | tee output/inventory-ci/complex-inventory.log
      - name: Tracked product pages in the browser
        run: |
          set -euo pipefail
          node --test tests/postgres/tracked-product-pages.test.js 2>&1 | tee output/inventory-ci/tracked-products.log
      - name: Provider automatic import and owner approval
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/provider-automatic-pages.test.js tests/postgres/provider-catalog-import.test.js tests/postgres/catalogue-stock-evidence.test.js tests/postgres/accounting-catalog-import.test.js 2>&1 | tee output/inventory-ci/provider-import.log
      - name: Full large-import certification
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')
        timeout-minutes: 240
        env:
          STOCKCHIEF_RUN_LARGE_IMPORT: '1'
          STOCKCHIEF_IMPORT_CERTIFICATION_ROWS: ${{ inputs.large_rows || '1000000' }}
        run: |
          set -euo pipefail
          node --max-old-space-size=1024 --test tests/certification/inventory-million-rows.test.js 2>&1 | tee output/inventory-ci/large-import.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-capacity-results
          path: output/inventory-ci
