name: Inventory correctness and capacity
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, codex/staging-codex-pilot]
  workflow_dispatch:
    inputs:
      large_rows:
        description: Rows in the full PostgreSQL import certification (1000–2000000)
        default: '1000000'
        required: true
      profile_only:
        description: Run the full synthetic import with query profiling; normal release checks stay unchanged
        type: boolean
        default: false
      stock_only:
        description: Profile stock receipts against an existing catalogue; requires profile_only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Long certifications preserve evidence for their source revision. Normal
  # PR checks still replace obsolete runs when another commit is pushed.
  group: inventory-capacity-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')) && github.sha || 'latest' }}-${{ inputs.stock_only && 'stock' || 'catalogue' }}
  cancel-in-progress: true
jobs:
  inventory_checks:
    name: inventory / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [unit, scale, core, agents, variants, providers]
    if: github.event_name != 'workflow_dispatch' || !inputs.profile_only
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification')) && 300 || 45 }}
    env:
      NODE_ENV: test
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install PostgreSQL 17
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          # Some runners time out on www.postgresql.org; the same signing key
          # is also published by PostgreSQL's official package repository.
          if ! sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc; then
            sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc
          fi
          fingerprint="$(gpg --batch --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=moderate
      - id: test_ready
        run: |
          npx playwright install --with-deps chromium
          mkdir -p output/inventory-ci
      - name: Query deadlines, recovery and dense catalogue regressions
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'scale' }}
        run: node --test --test-concurrency=2 tests/postgres/import-stock-stale-statistics.test.js tests/postgres/import-source-checkpoint-scale.test.js tests/postgres/import-legacy-lookup-scale.test.js tests/postgres/replenishment-expiry-scale.test.js tests/postgres/replenishment-cycle.test.js tests/postgres/staging-million-fixture.test.js tests/postgres/query-deadlines.test.js tests/postgres/round16-web-recovery.test.js tests/postgres/product-planning-scale.test.js tests/postgres/grouped-inventory-skew.test.js tests/postgres/home-work-history-window.test.js tests/postgres/dashboard-covered-reads.test.js
      - name: Shared inbox sources, private approvals and exact lot expiry
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'scale' }}
        run: node --test --test-concurrency=1 tests/postgres/catalog-legacy-facts-lookup.test.js tests/postgres/maintenance-read-locality.test.js tests/postgres/import-statistics.test.js tests/postgres/inventory-rollup-deltas.test.js tests/postgres/measured-stock.test.js tests/postgres/sku-stock-summary.test.js tests/postgres/movement-bucket-summary.test.js tests/postgres/home-brief-stock.test.js tests/postgres/sku-cost-summaries.test.js tests/postgres/inventory-overview-aggregation.test.js tests/postgres/report-card-sharing.test.js tests/postgres/home-shared-stock.test.js tests/postgres/import-additive-preview-reads.test.js tests/postgres/sku-movement-access.test.js tests/postgres/import-stock-locality.test.js tests/postgres/stock-visibility-maintenance.test.js tests/postgres/stock-value-aggregate-contract.test.js tests/postgres/sparse-quantity-coverage.test.js tests/postgres/cold-stock-positions.test.js tests/postgres/source-upload-stock-mode.test.js tests/postgres/needs-shared-inputs.test.js tests/postgres/round16-attention-capacity.test.js tests/postgres/round16-versioned-reads.test.js
      - name: Imported source index integrity and write amplification
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'scale' }}
        run: node --test tests/postgres/catalog-source-index-policy.test.js tests/postgres/import-catalogue-index-scope.test.js
      - name: Bounded verified import cache cleanup
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'scale' }}
        run: node --test tests/postgres/import-cache-cleanup-scale.test.js
      - name: Hosted qualification uses normal login and cleans up synthetic credentials
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: node --test tests/postgres/staging-load-login.test.js tests/postgres/staging-qualification-checkpoint.test.js
      - name: Compact import receipts, exact replay and global stock costs
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: node --test --test-concurrency=1 tests/postgres/atomic-receipt-batches.test.js tests/postgres/import-compact-receipt-recovery.test.js tests/postgres/global-stock-cost-totals.test.js tests/postgres/import-mapped-context.test.js tests/postgres/import-default-reorders.test.js
      - name: Deferred transaction costs and bounded report setup checks
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: node --test --test-concurrency=1 tests/postgres/shared-catalog-sessions.test.js tests/postgres/journal-number-allocation.test.js tests/postgres/commercial-resources.test.js tests/postgres/report-reorder-existence.test.js tests/postgres/report-ledger-account-scope.test.js
      - name: Parallel stock lanes, reserved journals and durable recovery
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: node --test --test-concurrency=1 tests/postgres/import-journal-reservations.test.js tests/postgres/import-stock-lane-order.test.js tests/postgres/import-stock-lanes.test.js tests/postgres/import-stock-lane-pool.test.js
      - name: Combined staging order money, refunds, plan locks and storage registration
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: node --test --test-concurrency=2 tests/postgres/runtime.test.js tests/postgres/order-money-truth.test.js tests/postgres/read-committed-write-invariants.test.js tests/postgres/read-side-business-totals.test.js tests/postgres/assistant-commercial-boundaries.test.js tests/postgres/environment-agent-commercial.test.js tests/postgres/bulk-approve-decisions.test.js tests/postgres/round10-refund-retention.test.js
      - name: Cleanup lease renewal and worker shutdown
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
