        run: node --test tests/postgres/round16-receipt-operation-writes.test.js tests/postgres/bulk-balance-write-once.test.js
      - name: Full large-import certification
        if: matrix.group == 'scale' && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'scale-certification'))
        timeout-minutes: 240
        env:
          STOCKCHIEF_RUN_LARGE_IMPORT: '1'
          STOCKCHIEF_IMPORT_CERTIFICATION_ROWS: ${{ inputs.large_rows || '1000000' }}
        run: |
          set -euo pipefail
          node --max-old-space-size=1024 --test tests/certification/inventory-million-rows.test.js 2>&1 | tee output/inventory-ci/large-import.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-capacity-results-${{ matrix.group }}
          path: output/inventory-ci
  inventory:
    name: inventory
    needs: inventory_checks
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || !inputs.profile_only) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every inventory group
        env:
          RESULT: ${{ needs.inventory_checks.result }}
        run: test "$RESULT" = success
  import-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_only
    uses: ./.github/workflows/import-query-profile.yml
    with:
      rows: ${{ inputs.large_rows }}
      stock_only: ${{ inputs.stock_only || false }}
