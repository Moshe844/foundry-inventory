name: AWS import subsystem
on:
  pull_request:
    branches: [codex/production-pilot]
    paths:
      - 'src/imports/**'
      - 'src/db/**'
      - 'src/aws-import-worker-server.js'
      - 'src/postgres-worker-server.js'
      - 'src/web/**'
      - 'infra/aws-imports/**'
      - 'infra/aws-database/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/aws-imports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pinned AWS Guard checks for private encrypted versioned sources
        run: bash infra/aws-imports/check-guard.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-import-security
          path: output/aws-import-security
          if-no-files-found: ignore
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_ENV: test
      FOUNDRY_SKIP_LOCAL_ENV: '1'
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: |
          node infra/aws-imports/build-template.js
          node infra/aws-imports/build-rds-template.js
          node infra/aws-database/build-template.js
          git diff --exit-code -- infra/aws-imports/template.json infra/aws-imports/template-rds.json infra/aws-database/template.json
      - run: |
          pipx run --spec cfn-lint==1.61.0 cfn-lint infra/aws-imports/template.json
          # These two informational outputs intentionally repeat imported network IDs.
          # Keep their interface; retain every other lint rule and the separate Guard gate.
          pipx run --spec cfn-lint==1.61.0 cfn-lint infra/aws-imports/template-rds.json --ignore-checks W6001
          pipx run --spec cfn-lint==1.61.0 cfn-lint infra/aws-database/template.json
      - name: Install disposable PostgreSQL
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - name: AWS boundaries, tenant isolation, queue recovery and COPY integrity
        run: node --test tests/unit/aws-import-transport.test.js tests/unit/aws-import-infrastructure.test.js tests/unit/aws-database-infrastructure.test.js tests/unit/aws-rds-import-infrastructure.test.js tests/unit/aws-database-connection.test.js tests/unit/import-copy-rows.test.js tests/postgres/aws-direct-import.test.js tests/postgres/import-copy-rows.test.js tests/postgres/import-benchmark-diagnostics.test.js tests/postgres/import-mixed-stock-lanes.test.js tests/postgres/source-upload-stock-mode.test.js
      - name: Production-only import container
        run: |
          docker build -f infra/aws-imports/Dockerfile -t stockchief-import-worker:test .
          docker run --rm --entrypoint node stockchief-import-worker:test -e 'const h=require("./src/imports/aws-worker").dedicatedHandlers(require("./src/operations/postgres-runtime-handlers").create()); if(Object.keys(h).length!==2)process.exit(1); console.log("Dedicated import handlers loaded without development dependencies");'
      - name: Compare the exact 150000-row workload with COPY and parallel mixed-stock lanes
        timeout-minutes: 25
        env:
          STOCKCHIEF_COPY_REQUIRE_60S: '1'
          STOCKCHIEF_COPY_DIAGNOSTICS: '1'
          STOCKCHIEF_COPY_REFERENCE: '1'
        run: |
          git fetch --no-tags --depth=1 origin 6f578146aefd1d6746eb25560ea264ef116af580
          node scripts/benchmark-import-copy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-import-copy-comparison
          path: output/aws-import-copy-comparison
          if-no-files-found: ignore
