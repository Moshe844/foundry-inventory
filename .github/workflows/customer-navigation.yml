name: Customer navigation gate
on:
  pull_request:
  push:
    branches: [main, codex/staging-codex-pilot]
jobs:
  customer_checks:
    name: customer-navigation / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [core, crawl, shipping, agent-plans]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.group == 'agent-plans' && 55 || 40 }}
    env:
      NODE_ENV: test
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
      STOCKCHIEF_CLICK_ARTIFACT_DIR: output/customer-navigation-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # PostgreSQL's official repository; use the same major as Staging.
      # https://www.postgresql.org/download/linux/ubuntu/
      - name: Install PostgreSQL with bounded package downloads
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ] && getent ahosts archive.ubuntu.com >/dev/null; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          # Some runners time out on www.postgresql.org; the same signing key
          # is also published by PostgreSQL's official package repository.
          if ! sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc; then
            sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc
          fi
          fingerprint="$(gpg --batch --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - name: Install browser with bounded package downloads
        id: test_ready
        timeout-minutes: 8
        run: |
          # Avoid an unresponsive runner-image mirror holding the test gate.
          # Packages retain Ubuntu signature verification and HTTPS transport.
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ] && getent ahosts archive.ubuntu.com >/dev/null; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install chromium firefox
          probe_browsers() {
            node -e 'const {chromium,firefox}=require("playwright"); (async()=>{for(const engine of [chromium,firefox]){const browser=await engine.launch(); await browser.close();}})().catch(error=>{console.error(error); process.exitCode=1;});'
          }
          if ! probe_browsers; then
            npx playwright install-deps chromium firefox
            probe_browsers
          fi
          mkdir -p output/customer-navigation-ci
      - name: Agent plan permissions and operational workflows
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'agent-plans' }}
        run: |
          set -euo pipefail
          npm run test:agent-plans 2>&1 | tee output/customer-navigation-ci/agent-plans.log
      - name: Private authentication persists before redirects
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: |
          mkdir -p output/customer-navigation-ci
          set -euo pipefail
          node --test --test-concurrency=1 tests/postgres/owner-session-redirect.test.js tests/postgres/anonymous-session-publication.test.js tests/postgres/auth-http.test.js tests/postgres/auth-middleware.test.js 2>&1 | tee output/customer-navigation-ci/owner-session-redirect.log
      - if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: |
          mkdir -p output/customer-navigation-ci
          set -euo pipefail
          npm run test:customer-navigation:core 2>&1 | tee output/customer-navigation-ci/core-test.log
      - name: Plan changes and first-customer regression tests
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/unit/commercial-stripe-lifecycle.test.js tests/unit/staging-plan-portal.test.js tests/unit/annual-usage-periods.test.js tests/unit/return-navigation.test.js tests/unit/report-build-pending-browser.test.js tests/postgres/commercial-lifecycle-ui.test.js tests/postgres/round15-plan-limits.test.js tests/postgres/public-information.test.js tests/postgres/public-api-ui.test.js tests/postgres/round15-first-sale.test.js tests/postgres/round15-report-credits.test.js tests/postgres/report-stock-cost-detail.test.js tests/postgres/existing-stock-costs-ui.test.js 2>&1 | tee output/customer-navigation-ci/round15.log
      - name: Imported stock wording and default reorder rules
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'core' }}
        run: node --test tests/postgres/import-stock-words-and-reorder.test.js
      - name: Click every customer destination
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'crawl' }}
        run: |
          set -euo pipefail
          npm run test:customer-navigation:links 2>&1 | tee output/customer-navigation-ci/link-test.log
      - name: Redesigned orders and order entry in the browser
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'shipping' }}
        run: |
          set -euo pipefail
          node --test tests/postgres/orders-redesign-ui.test.js tests/postgres/buy-redesign-ui.test.js 2>&1 | tee output/customer-navigation-ci/orders-redesign.log
      - name: Profit parts, large pages and one way back
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'shipping' }}
        run: |
          set -euo pipefail
          node --test tests/postgres/money-margin-pager-and-back-links.test.js 2>&1 | tee output/customer-navigation-ci/money-pagination-navigation.log
      - name: Shipping connections and customer addresses
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'shipping' }}
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/shipping-first-order.test.js tests/postgres/shipping-account-verification.test.js tests/postgres/shipping-order-panel.test.js tests/postgres/shipping-ui.test.js tests/postgres/round7-controls-customers.test.js 2>&1 | tee output/customer-navigation-ci/shipping-addresses.log
      - name: Ask downloads, phone layout and consistent business pickers
        if: ${{ !cancelled() && steps.test_ready.outcome == 'success' && matrix.group == 'shipping' }}
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 tests/postgres/ask-followups-downloads-phone.test.js tests/postgres/same-rules-for-every-business.test.js 2>&1 | tee output/customer-navigation-ci/ask-business-consistency.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-navigation-results-${{ matrix.group }}
          path: output/customer-navigation-ci
  customer-navigation:
    name: Required customer navigation and account safety
    needs: customer_checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every navigation group
        env:
          RESULT: ${{ needs.customer_checks.result }}
        run: test "$RESULT" = success
