name: Remaining connector qualification
on:
  pull_request:
    paths:
      - src/connections/providers/clover.js
      - src/connections/providers/quickbooks.js
      - src/connections/providers/xero.js
      - src/connections/providers/oauth-grant.js
      - tests/unit/remaining-provider-authorization.test.js
      - tests/postgres/remaining-provider-authorization.test.js
      - .github/workflows/remaining-connector-qualification.yml
permissions:
  contents: read
jobs:
  remaining-connectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_ENV: test
      FOUNDRY_SKIP_LOCAL_ENV: '1'
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install PostgreSQL with bounded downloads
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ] && getent ahosts archive.ubuntu.com >/dev/null; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          if ! sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc; then
            sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc
          fi
          fingerprint="$(gpg --batch --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 8
        run: |
          npx playwright install chromium
          if ! node -e 'require("playwright").chromium.launch().then(b=>b.close()).catch(()=>process.exit(1))'; then
            npx playwright install-deps chromium
          fi
      - name: Provider contracts, company selection and refresh response validation
        run: |
          set -euo pipefail
          mkdir -p output/remaining-connectors
          node --test tests/unit/remaining-provider-authorization.test.js tests/unit/mission9-provider-contracts.test.js tests/unit/integration-quickbooks-contract.test.js tests/unit/accounting-catalog-contract.test.js 2>&1 | tee output/remaining-connectors/contracts.log
      - name: All-plan consent, preserved credentials, webhook isolation and accounting authority
        run: |
          set -euo pipefail
          node --test --test-force-exit --test-concurrency=2 tests/postgres/remaining-provider-authorization.test.js tests/postgres/connections-restored-pilot.test.js tests/postgres/clover-webhooks.test.js tests/postgres/accounting-export-ui.test.js tests/postgres/agent-accounting-documents.test.js tests/postgres/connections-catalog-browser.test.js 2>&1 | tee output/remaining-connectors/connections.log
      - name: Existing subscriptions, refunds, Shopify and connection lifecycle
        run: |
          set -euo pipefail
          node --test --test-force-exit --test-concurrency=2 tests/postgres/commercial-refunds.test.js tests/postgres/subscription-guarantee.test.js tests/postgres/commercial-wallet.test.js tests/postgres/shopify-public-install.test.js tests/postgres/shopify-managed-billing.test.js tests/postgres/connection-popup-return.test.js 2>&1 | tee output/remaining-connectors/preservation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-connector-qualification
          path: output/remaining-connectors
          retention-days: 14
