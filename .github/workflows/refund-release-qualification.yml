name: Refund billing release qualification
on:
  pull_request:
    paths:
      - src/postgres-app.js
      - src/operations/postgres-data-access.js
      - src/operations/postgres-retention.js
      - src/web/commercial-middleware.js
      - src/db/postgres-migrations/*shopify*
      - src/commercial/stripe-request-classification.js
      - src/commercial/network.js
      - src/db/postgres-migrations/536-refund-http-cost-evidence.sql
      - tests/postgres/subscription-guarantee.test.js
      - .github/workflows/refund-release-qualification.yml
permissions:
  contents: read
jobs:
  refund-billing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      FOUNDRY_SKIP_LOCAL_ENV: '1'
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install PostgreSQL with bounded downloads
        timeout-minutes: 8
        run: |
          set -euo pipefail
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ] && getent ahosts archive.ubuntu.com >/dev/null; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          if ! sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc; then
            sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc
          fi
          fingerprint="$(gpg --batch --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npx playwright install chromium
          if ! node -e 'require("playwright").chromium.launch().then(b=>b.close()).catch(()=>process.exit(1))'; then
            npx playwright install-deps chromium
          fi
      - name: Verify native refunds, all paid-plan top-ups and unknown cost safeguards
        run: |
          set -euo pipefail
          mkdir -p output/refund-release
          git rev-parse HEAD | tee output/refund-release/commit.txt
          git rev-parse HEAD:src | tee output/refund-release/application-tree.txt
          node --test --test-force-exit --test-concurrency=2 tests/unit/commercial-network.test.js tests/postgres/subscription-guarantee.test.js tests/postgres/commercial-provider-costs.test.js tests/postgres/capacity-topups-browser.test.js tests/postgres/commercial-lifecycle-ui.test.js tests/postgres/round17-billing-preview-contract.test.js tests/postgres/agent-plan-addons.test.js 2>&1 | tee output/refund-release/checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-billing-qualification
          path: output/refund-release


