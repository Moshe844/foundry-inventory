name: Private Shopify release qualification
on:
  pull_request:
    paths:
      - src/postgres-app.js
      - src/operations/postgres-data-access.js
      - src/operations/postgres-retention.js
      - src/sales/agent-credit-holds.js
      - src/web/commercial-middleware.js
      - src/web/views/public/data-protection.ejs
      - src/web/views/public/legal.ejs
      - tests/postgres/shopify-data-protection.test.js
      - src/commercial/release.js
      - src/commercial/connector-request-cost.js
      - src/commercial/operations.js
      - src/commercial/network.js
      - src/commercial/*shopify*
      - src/commercial/entitlements.js
      - src/commercial/service.js
      - src/commercial/plan-navigation.js
      - src/db/postgres-migrations/*shopify*
      - src/web/routes/postgres-shopify-public.js
      - src/web/routes/postgres-auth.js
      - src/web/routes/postgres-commercial.js
      - src/web/views/commercial/shopify-billing.ejs
      - src/web/public/shopify-billing.css
      - src/operations/postgres-runtime-handlers.js
      - tests/unit/shopify-managed-billing.test.js
      - tests/postgres/shopify-managed-billing*.test.js
      - src/connections/postgres-event-ingestion.js
      - src/connections/postgres-webhook-inbox.js
      - src/connections/launch-policy.js
      - src/connections/postgres-shopify-public-install.js
      - src/connections/postgres-shopify-uninstall.js
      - src/connections/postgres-provider-service.js
      - src/connections/providers/shopify.js
      - src/connections/postgres-provider-sync.js
      - src/connections/shopify-token-lifecycle.js
      - src/connections/provider-sync-failure.js
      - src/web/presentation/connections.js
      - src/web/views/connections/**
      - tests/unit/shopify-token-lifecycle.test.js
      - tests/unit/provider-sync-failure.test.js
      - tests/postgres/shopify-public-install.test.js
      - tests/postgres/connection-popup-return.test.js
      - tests/postgres/shopify-uninstall.test.js
      - tests/postgres/shopify-refund-authority.test.js
      - tests/postgres/shopify-development-reactivation.test.js
      - tests/postgres/shopify-webhooks.test.js
      - tests/unit/commercial-connector-request-cost.test.js
      - .github/workflows/shopify-pilot-qualification.yml
permissions:
  contents: read
jobs:
  shopify-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_ENV: test
      FOUNDRY_SKIP_LOCAL_ENV: '1'
      STOCKCHIEF_POSTGRES_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install PostgreSQL with bounded downloads
        timeout-minutes: 8
        run: |
          set -euo pipefail
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-stockchief-ci-network > /dev/null
          if [ -f /etc/apt/apt-mirrors.txt ] && getent ahosts archive.ubuntu.com >/dev/null; then
            sudo sed -i -E 's|https?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo install -d /usr/share/postgresql-common/pgdg
          if ! sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc; then
            sudo curl --fail --connect-timeout 15 --max-time 90 --retry 2 --retry-all-errors --retry-delay 2 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc
          fi
          fingerprint="$(gpg --batch --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npx playwright install chromium
          if ! node -e 'require("playwright").chromium.launch().then(b=>b.close()).catch(()=>process.exit(1))'; then
            npx playwright install-deps chromium
          fi
      - name: Verify private Shopify, all-plan billing and provider safeguards
        run: |
          set -euo pipefail
          mkdir -p output/shopify-pilot-release
          git rev-parse HEAD:src | tee output/shopify-pilot-release/application-tree.txt
          node --test --test-force-exit --test-concurrency=2 tests/postgres/shopify-public-install.test.js tests/postgres/connection-popup-return.test.js tests/postgres/shopify-uninstall.test.js tests/postgres/shopify-refund-authority.test.js tests/postgres/shopify-webhooks.test.js tests/postgres/shopify-managed-billing.test.js tests/postgres/shopify-development-reactivation.test.js tests/postgres/shopify-managed-billing-ui.test.js tests/unit/shopify-managed-billing.test.js tests/unit/commercial-connector-request-cost.test.js tests/unit/commercial-launch-provider-policy.test.js tests/unit/shopify-token-lifecycle.test.js tests/unit/provider-sync-failure.test.js tests/postgres/commercial-provider-costs.test.js tests/postgres/subscription-guarantee.test.js tests/postgres/capacity-topups-browser.test.js tests/postgres/commercial-lifecycle-ui.test.js 2>&1 | tee output/shopify-pilot-release/checks.log
      - name: Verify data protection, all-plan privacy rights and existing private disclosures
        run: |
          set -euo pipefail
          node --test --test-force-exit --test-concurrency=2 tests/unit/data-access-sink.test.js tests/postgres/shopify-data-protection.test.js tests/postgres/agent-credit-holds.test.js tests/postgres/retention-cleanup.test.js tests/postgres/shopify-privacy.test.js tests/postgres/shopify-privacy-orders.test.js tests/postgres/round16-security-audit.test.js tests/postgres/round10-refund-retention.test.js tests/postgres/private-owner-console.test.js tests/postgres/public-api-ui.test.js tests/postgres/agent-customer-order-pages.test.js tests/postgres/agent-buyer-quote-acceptance.test.js tests/postgres/shipstation-custom-store.test.js tests/postgres/cardknox-gateway.test.js tests/postgres/agent-inbound-freight.test.js 2>&1 | tee output/shopify-pilot-release/data-protection.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-shopify-qualification
          path: output/shopify-pilot-release

