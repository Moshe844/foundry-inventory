# The production website and worker in Render's Ohio region, next to the AWS database
# (us-east-2). Same code branch, plans, commands and shared settings as the Virginia
# services in render.production-pilot.yaml; no Render database is created here.
#
# Before the first publish, in each service's Environment page:
# - FOUNDRY_DATABASE_URL: the website login (stockchief_runtime) at the AWS endpoint,
#   ending in ?sslmode=verify-full. The AWS certificates ship with the app.
# - FOUNDRY_DATABASE_MIGRATION_URL: the owner login (stockchief_owner), same endpoint;
#   used only when publishing runs migrations.
# - RESEND_API_KEY and FOUNDRY_FROM_EMAIL: the same values as the Virginia service.
# Everything else (session and encryption keys, payment, email, connection and AI keys)
# comes from the shared stockchief-production-runtime group. Its Render database
# certificate settings are ignored for the AWS address (src/db/postgres.js tlsFor).
# The worker starts paused (FOUNDRY_WORKER_PAUSED) so it cannot run jobs before the switch.
services:
  - type: web
    name: stockchief-production-web-ohio
    runtime: node
    repo: https://github.com/Moshe844/foundry-inventory
    branch: codex/production-pilot
    region: ohio
    plan: 1c-2g
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run db:apply:postgres
    startCommand: exec node src/postgres-web-server.js
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: stockchief-production-runtime
      - key: FOUNDRY_DATABASE_URL
        sync: false
      - key: FOUNDRY_DATABASE_MIGRATION_URL
        sync: false
      - key: FOUNDRY_DATABASE_RUNTIME_ROLE
        value: stockchief_runtime
      - key: FOUNDRY_PROCESS_ROLE
        value: web
      # The AWS database's disk, for disk-space alerts (Render's was 15 GB).
      - key: FOUNDRY_POSTGRES_DISK_GB
        value: "50"
      - key: RESEND_API_KEY
        sync: false
      - key: FOUNDRY_FROM_EMAIL
        sync: false
  - type: worker
    name: stockchief-production-worker-ohio
    runtime: node
    repo: https://github.com/Moshe844/foundry-inventory
    branch: codex/production-pilot
    region: ohio
    plan: 1c-2g
    autoDeployTrigger: off
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run db:apply:postgres
    startCommand: exec node src/postgres-worker-server.js
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: stockchief-production-runtime
      - key: FOUNDRY_DATABASE_URL
        sync: false
      - key: FOUNDRY_DATABASE_MIGRATION_URL
        sync: false
      - key: FOUNDRY_DATABASE_RUNTIME_ROLE
        value: stockchief_runtime
      - key: FOUNDRY_PROCESS_ROLE
        value: worker
      # The AWS database's disk, for disk-space alerts (Render's was 15 GB).
      - key: FOUNDRY_POSTGRES_DISK_GB
        value: "50"
      # Runs no jobs until the switch; remove this setting at the switch, then publish.
      - key: FOUNDRY_WORKER_PAUSED
        value: "true"
      # Large imports save stock in four parallel lanes (measured on AWS).
      - key: FOUNDRY_IMPORT_STOCK_WORKERS
        value: "4"
      - key: RESEND_API_KEY
        sync: false
      - key: FOUNDRY_FROM_EMAIL
        sync: false
