previews:
  generation: off

projects:
  - name: My project
    environments:
      - name: Staging
        envVarGroups:
          - name: stockchief-staging-runtime
            envVars:
              - key: NODE_ENV
                value: production
              - key: FOUNDRY_PUBLIC_URL
                value: https://qualify.stockchiefhq.com
              - key: FOUNDRY_DATABASE_PRIVATE_NETWORK
                value: "true"
              - key: FOUNDRY_POSTGRES_DISK_GB
                value: "15"
              - key: FOUNDRY_PROCESS_MEMORY_MB
                value: "2048"
              - key: FOUNDRY_PROCESS_CPU_CORES
                value: "1"
              # Publishing the foundation does not approve economics or checkout.
              - key: STOCKCHIEF_CHECKOUT_ENABLED
                value: "false"
              # Tax API use needs separate fee and tax-obligation approval.
              - key: STOCKCHIEF_BILLING_AUTOMATIC_TAX
                value: "false"
              # Fee evidence is account-specific. A different live billing account
              # requires a new fee review before checkout can open.
              - key: STOCKCHIEF_BILLING_STRIPE_ACCOUNT_ID
                value: acct_1UBFTdIjKuQgOJD6
              - key: SESSION_SECRET
                generateValue: true
              - key: FOUNDRY_CONNECTION_ENCRYPTION_KEY
                generateValue: true
              - key: FOUNDRY_ALERT_ACK_TOKEN
                generateValue: true
              - key: STOCKCHIEF_BILLING_STRIPE_SECRET_KEY
                sync: false
              - key: STOCKCHIEF_BILLING_STRIPE_WEBHOOK_SECRET
                sync: false
              - key: STOCKCHIEF_BILLING_STRIPE_PUBLISHABLE_KEY
                sync: false
              - key: STOCKCHIEF_COMMERCIAL_ADMIN_EMAILS
                sync: false
        databases:
          - name: stockchief-staging
        services:
          - type: web
            name: stockchief-staging-web
            runtime: node
            repo: https://github.com/Moshe844/foundry-inventory
            region: virginia
            plan: 1c-2g
            branch: main
            autoDeployTrigger: off
            buildCommand: npm ci --omit=dev
            preDeployCommand: npm run db:apply:postgres
            startCommand: npm run start:postgres-web
            healthCheckPath: /readyz
            maxShutdownDelaySeconds: 120
            envVars:
              - fromGroup: stockchief-staging-runtime
              - key: FOUNDRY_DATABASE_URL
                fromDatabase:
                  name: stockchief-staging
                  property: connectionString
              - key: FOUNDRY_PROCESS_ROLE
                value: web
          - type: worker
            name: stockchief-staging-worker
            runtime: node
            repo: https://github.com/Moshe844/foundry-inventory
            region: virginia
            plan: 1c-2g
            branch: main
            autoDeployTrigger: off
            buildCommand: npm ci --omit=dev
            preDeployCommand: npm run db:apply:postgres
            startCommand: npm run start:postgres-worker
            maxShutdownDelaySeconds: 120
            envVars:
              - fromGroup: stockchief-staging-runtime
              - key: FOUNDRY_DATABASE_URL
                fromDatabase:
                  name: stockchief-staging
                  property: connectionString
              - key: FOUNDRY_PROCESS_ROLE
                value: worker
